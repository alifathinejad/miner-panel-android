name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake \
            build-essential ccache

      - name: Install Buildozer & Cython (pinned stable versions)
        run: |
          pip install --upgrade "pip<25"
          pip install "buildozer==1.5.0" "cython==0.29.36" "python-for-android==2024.1.21" "virtualenv<21"

      - name: Build with Buildozer
        env:
          VIRTUALENV_PYTHON: /opt/hostedtoolcache/Python/3.11.16/x64/bin/python3
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miner-panel-apk
          path: bin/*.apk
